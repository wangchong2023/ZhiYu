name: ZhiYu
# ──────────────────────────────────────────────────────────────────────────────
# SPM 包声明
# ──────────────────────────────────────────────────────────────────────────────
# 此文件是模板，由 bootstrap.sh 通过 envsubst 生成实际的 project.yml。
# 禁止直接编辑 project.yml（生成物），所有改动请在此文件进行。
#
# 分组规则：
#   [外部开源库] 全部使用 /Users/constantine/Documents/work/code/opensrc/swift/<库目录名> 本地路径，统一离线优先策略。
#               库信息维护于 Config/opensource_dependencies.yml。
#   [内部 SPM 包] 使用相对路径 Packages/<PackageName>，无需环境变量。
# ──────────────────────────────────────────────────────────────────────────────
packages:

  # ── 外部开源库（本地克隆，离线优先）────────────────────────────────────────
  # 依赖信息：Config/opensource_dependencies.yml
  # 克隆目录：/Users/constantine/Documents/work/code/opensrc/swift（由 Config/.env.local 配置）

  # 存储引擎
  GRDB:
    path: /Users/constantine/Documents/work/code/opensrc/swift/GRDB.swift

  # JSON 自愈（双层防护）
  SwiftJSONSanitizer:
    path: /Users/constantine/Documents/work/code/opensrc/swift/SwiftJSONSanitizer
  PartialJSON:
    path: /Users/constantine/Documents/work/code/opensrc/swift/PartialJSON

  # UI 渲染
  Lottie:
    path: /Users/constantine/Documents/work/code/opensrc/swift/lottie-ios
  SwiftMarkdownUI:
    path: /Users/constantine/Documents/work/code/opensrc/swift/swift-markdown-ui
  SwiftMarkdown:
    path: /Users/constantine/Documents/work/code/opensrc/swift/swift-markdown

  # 文件处理
  ZIPFoundation:
    path: /Users/constantine/Documents/work/code/opensrc/swift/ZIPFoundation

  # 测试工具
  SnapshotTesting:
    path: /Users/constantine/Documents/work/code/opensrc/swift/swift-snapshot-testing

  # ── 内部 SPM 包（相对路径，无需环境变量）──────────────────────────────────
  UFPCore:
    path: Packages/UFPCore
  UFPStorage:
    path: Packages/UFPStorage
  UFPDesignSystem:
    path: Packages/UFPDesignSystem
  ZhiYuDomain:
    path: Packages/ZhiYuDomain
  ZhiYuAICore:
    path: Packages/ZhiYuAICore
  ZhiYuFeatures:
    path: Packages/ZhiYuFeatures

options:
  bundleIdPrefix: com.zhiyu.app
  developmentLanguage: en
  knownLocalizations:
    - en
    - zh-Hans
    - zh-Hant
    - ja
    - ko
    - es
    - fr
    - ar
    - ru
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.0.0-dev"       # CI 会在构建前通过 inject_version.sh 覆盖
    CURRENT_PROJECT_VERSION: "0"          # CI 会在构建前通过 inject_version.sh 覆盖
    TARGETED_DEVICE_FAMILY: "1,2,4"
    INFOPLIST_FILE: Sources/Info.plist
    DEVELOPMENT_TEAM: "XSC749SK6J"
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SUPPRESS_WARNINGS_FROM_PACKAGE_DEPENDENCIES: YES
    SWIFT_COMPILATION_MODE: wholemodule
    SWIFT_GENERATE_LOCALIZATION_SYMBOL_KEYS: NO
    EAGER_COMPILATION_ENABLED: NO
    MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks

targetTemplates:
  BaseAppTemplate:
    preBuildScripts:
      - script: "export PATH=\"$PATH:/opt/homebrew/bin:/usr/local/bin:/usr/bin\"\npython3 Tools/scripts/run-quality-all-audits.py"
        name: "[Gatekeeper] All Quality & Security Audits"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: UFPCore
      - package: UFPStorage
      - package: UFPDesignSystem
      - package: ZhiYuDomain
      - package: ZhiYuAICore
      - package: ZhiYuFeatures
      - package: GRDB
      - package: ZIPFoundation
  WatchAppTemplate:
    preBuildScripts:
      - script: "export PATH=\"$PATH:/opt/homebrew/bin:/usr/local/bin:/usr/bin\"\npython3 Tools/scripts/run-quality-all-audits.py"
        name: "[Gatekeeper] All Quality & Security Audits"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: UFPCore
      - package: UFPStorage
      - package: UFPDesignSystem
      - package: ZhiYuDomain
      - package: ZhiYuAICore
      - package: ZhiYuFeatures
      - package: GRDB
      - package: ZIPFoundation

targets:
  ZhiYu:
    templates:
      - BaseAppTemplate
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Platforms/macOS/**"
          - "Platforms/watchOS/**"
          - "Platforms/iOS/Widgets/**"
          - "MacInfo.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhiyu.app
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-iOS
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        CODE_SIGN_ENTITLEMENTS: Sources/ZhiYu.entitlements
        NSSupportsLiveActivities: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/ZhiYu-Bridging-Header.h
      configs:
        Debug:
          SWIFT_STRICT_CONCURRENCY: targeted
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - package: SwiftMarkdownUI
        product: MarkdownUI
      - package: SwiftJSONSanitizer
        product: SwiftJSONSanitizerDynamic
      - package: PartialJSON
        product: PartialJSON
      - target: ZhiYuWidgets
      - framework: Frameworks/WechatOpenSDK.xcframework
      - framework: Frameworks/ATAuthSDK_D.xcframework

  ZhiYuMac:
    templates:
      - BaseAppTemplate
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Platforms/watchOS/**"
          - "Platforms/iOS/Widgets/**"
          - "Info.plist"
          - "Base.lproj/**"
          - "LaunchScreen.storyboard"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhiyu.app.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-iOS
        INFOPLIST_FILE: Sources/MacInfo.plist
        SUPPORTS_MACCATALYST: "YES"
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/ZhiYu-Bridging-Header.h
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/ZhiYu.entitlements
    dependencies:
      - package: SwiftMarkdown
        product: Markdown
      - package: SwiftMarkdownUI
        product: MarkdownUI
      - package: SwiftJSONSanitizer
        product: SwiftJSONSanitizerDynamic
      - package: PartialJSON
        product: PartialJSON

  ZhiYuWatch:
    templates:
      - WatchAppTemplate
    type: application
    platform: watchOS
    sources:
      # watchOS 专属源码
      - path: Sources/Platforms/watchOS
      - path: Sources/Platforms/Shared
      # 本地化
      - path: Sources/Localization
      # L0 基础设施：DI 容器、协议、常量、Stubs、工具
      # ServiceContainer 由 UFPCore SPM 包提供（方案 A：消除重复源码）
      - path: Sources/Core/Base/Utils/Localized.swift
      - path: Sources/Core/Base/Utils/PageContentUtility.swift
      - path: Sources/Core/Base/Constants
      - path: Sources/Core/Base/Stubs
      - path: Sources/Core/Base/Protocols
      # L0 系统服务：Logger、Haptic、Routing、AudioSplitter、SecurityReinforcement、Notifications
      - path: Sources/Core/System/Logger/Logger.swift
      - path: Sources/Core/System/Haptic/WatchHapticService.swift
      - path: Sources/Core/System/Routing/AppLinkProcessor.swift
      - path: Sources/Core/System/Workflow/AudioSplitter.swift
      - path: Sources/Core/System/Security/SecurityReinforcement.swift
      - path: Sources/Core/System/Notifications/AppNotifications.swift
      - path: Sources/Core/System/TestModeDetector.swift
      # L1.5 领域层：模型、协议、RAG
      - path: Sources/Domain/Models/KnowledgePage.swift
      - path: Sources/Domain/Models/PageType.swift
      - path: Sources/Domain/Models/LintIssue.swift
      - path: Sources/Domain/Models/SearchConstants.swift
      - path: Sources/Domain/Models/SearchDiagnosticInfo.swift
      - path: Sources/Domain/Models/RAGModels.swift
      - path: Sources/Domain/Models/ChunkType.swift
      - path: Sources/Domain/Models/DomainThresholds.swift
      - path: Sources/Domain/Models/PromptConstants.swift
      - path: Sources/Domain/Protocols/IngestServiceProtocol.swift
      - path: Sources/Domain/Protocols/EmbeddingProvider.swift
      - path: Sources/Domain/Protocols/SyncProtocols.swift
      - path: Sources/Domain/Protocols/SpeechServiceProtocol.swift
      - path: Sources/Domain/Protocols/SearchIndexerProtocol.swift
      - path: Sources/Domain/Protocols/LLMServiceProtocol.swift
      - path: Sources/Domain/Protocols/LinkServiceProtocol.swift
      - path: Sources/Domain/Protocols/StoreCapabilities.swift
      - path: Sources/Domain/Protocols/PDFServiceProtocol.swift
      - path: Sources/Domain/Protocols/DTOs.swift
      - path: Sources/Domain/Protocols/UnsupportedSearchIndexer.swift
      - path: Sources/Domain/RAG/LinkService.swift
      # L1 基础设施模型
      - path: Sources/Infrastructure/Models/SpeechModels.swift
      - path: Sources/Infrastructure/Models/PDFModels.swift
      - path: Sources/Infrastructure/LLM/LLMConstants.swift
      - path: Sources/Infrastructure/LLM/LLMModels.swift
      # 协作模型（DiscoveredRoom/CollabUser，MultipeerConnectivity 已条件编译隔离）
      - path: Sources/Features/System/Collaboration/Model/CollaborationModels.swift
      # 共享设计系统（DesignSystem 令牌入口 + Tokens 子目录 + PageType UI 扩展）
      - path: Sources/Shared/DesignSystem/DesignSystem.swift
      - path: Sources/Shared/DesignSystem/Tokens
      - path: Sources/Shared/DesignSystem/Styles/PageType+UI.swift
      # 跨平台适配
      - path: Sources/Shared/Platforms/Adaptor/CrossPlatform.swift
      - path: Sources/Shared/Platforms/Adaptor/PlatformTraits.swift
      - path: Sources/Shared/Platforms/Adaptor/WatchFeaturePlaceholderView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhiyu.app.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Watch
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_WKWatchKitApp: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES

  ZhiYuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Platforms/iOS/Widgets
      - path: Sources/Platforms/iOS/Activity/AIProcessingAttributes.swift
      - path: Sources/Core/Base/Protocols/LiveActivityProtocol.swift
      - path: Sources/Core/Base/Constants/AppConstants.swift
      - path: Sources/Localization/Catalogs/Platform.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhiyu.app.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET
        INFOPLIST_FILE: Sources/Platforms/iOS/Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        NSSupportsLiveActivities: YES
        CODE_SIGN_ENTITLEMENTS: Sources/ZhiYuWidgets.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SDKROOT: iphoneos
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: UFPCore
      - package: UFPStorage
      - package: GRDB

  ZhiYuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "UITests/**"
          - "UI/**"
          - "Platforms/Watch*.swift"
      - path: Sources
        includes:
          - "Platforms/watchOS/WatchWatchSyncService.swift"
          - "Platforms/watchOS/WatchOCRService.swift"
          - "Platforms/watchOS/WatchPDFService.swift"
          - "Platforms/watchOS/WatchPasteboardService.swift"
          - "Platforms/watchOS/WatchSpeechService.swift"
          - "Platforms/iOS/Widgets/KnowledgeStatsWidget.swift"
          - "Platforms/iOS/Widgets/WidgetL10n.swift"
          - "Platforms/iOS/Widgets/WidgetRepository.swift"
          - "Platforms/iOS/Widgets/WidgetModels.swift"
          - "Platforms/iOS/Widgets/WidgetSharedConstants.swift"
          - "Core/Base/Constants/AppConstants.swift"
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: ZhiYu
      - package: SnapshotTesting

  ZhiYuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: ZhiYu
      - package: SnapshotTesting

  ZhiYuWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
        includes:
          - "Platforms/WatchPlatformTests.swift"
          - "Platforms/WatchSyncTests.swift"
          - "Platforms/WatchViewTests.swift"
          - "Shared/TestMocks.swift"
    dependencies:
      - target: ZhiYuWatch

  ZhiYuMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
        includes:
          - "Platforms/MacPlatformTests.swift"
      - path: Sources
        includes:
          - "Platforms/macOS/MacFileArchiver.swift"
          - "Platforms/macOS/MacOSPlatformCapabilities.swift"
          - "Platforms/macOS/MacPasteboardService.swift"
          - "Core/Base/Protocols/PasteboardProtocol.swift"
          - "Core/Base/Protocols/FileArchiverProtocol.swift"
          - "Core/Base/Protocols/PlatformCapabilities.swift"
          - "Core/Base/Constants/AppConstants.swift"

schemes:
  ZhiYu:
    build:
      targets:
        ZhiYu: all
      preActions:
        - script: "if [ -f \"$WORKSPACE_PATH/../Config/.env.local\" ]; then . \"$WORKSPACE_PATH/../Config/.env.local\"; fi"
          name: "[Auto-Sync] Load Environment"
    test:
      targets:
        - ZhiYuTests
        - ZhiYuUITests
      environmentVariables:
        RECORD_SNAPSHOTS: "0"
    run:
      executable: ZhiYu
  
  ZhiYuMac:
    build:
      targets:
        ZhiYuMac: all
      preActions:
        - script: "if [ -f \"$WORKSPACE_PATH/../Config/.env.local\" ]; then . \"$WORKSPACE_PATH/../Config/.env.local\"; fi"
          name: "[Auto-Sync] Load Environment"
    run:
      executable: ZhiYuMac
  
  ZhiYuMacTests:
    build:
      targets:
        ZhiYuMacTests: all
    test:
      targets:
        - ZhiYuMacTests
  
  ZhiYuWatch:
    build:
      targets:
        ZhiYuWatch: all
      preActions:
        - script: "if [ -f \"$WORKSPACE_PATH/../Config/.env.local\" ]; then . \"$WORKSPACE_PATH/../Config/.env.local\"; fi"
          name: "[Auto-Sync] Load Environment"
    test:
      targets:
        - ZhiYuWatchTests
    run:
      executable: ZhiYuWatch
