# ==============================================================================
# ZhiYu Platform (iOS App & Mobile Client) — SonarQube 全语言代码质量与安全分析配置
# 支持语言范围: Swift (iOS), Python, Shell (.sh/.bash), YAML (.yaml/.yml)
# 核心质量门禁 (Quality Gate):
#   1. 语句/行覆盖率 (Line Coverage) >= 95.0%
#   2. 分支覆盖率 (Branch Coverage) >= 90.0%
#   3. 代码重复率 (Duplicated Lines %) < 3.0%
# ==============================================================================

# 项目元数据定义
sonar.projectKey=ZhiYu-Mobile-iOS
sonar.projectName=ZhiYu Mobile iOS Client
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# 多模块定义 (Swift 应用源码 + 脚本工具与配置)
sonar.modules=app-swift,tools-scripts

# ── 移动端 App 主源码模块 (Swift / iOS) 内部属性配置 ─────────────────────────
app-swift.sonar.projectBaseDir=.
app-swift.sonar.projectName=ZhiYu App Core (Swift)
app-swift.sonar.sources=Sources
app-swift.sonar.tests=Tests
app-swift.sonar.test.inclusions=**/*Test.swift,**/*Tests.swift,**/*.test.swift
app-swift.sonar.swift.coverage.reportPath=build/reports/coverage.xcresult
app-swift.sonar.swift.swiftlint.reportPaths=build/reports/swiftlint.json

# ── 自动化脚本与配置模块 (Python / Shell / YAML) 内部属性配置 ──────────────────
tools-scripts.sonar.projectBaseDir=.
tools-scripts.sonar.projectName=ZhiYu Tools & Pipeline Scripts (Python / Shell / YAML)
tools-scripts.sonar.sources=Tools,fastlane,Config,.github
tools-scripts.sonar.inclusions=**/*.py,**/*.sh,**/*.bash,**/*.yaml,**/*.yml,project.yml,.gitlab-ci.yml
tools-scripts.sonar.python.version=3.12
