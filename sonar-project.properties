# ==============================================================================
# ZhiYu Platform — SonarQube 代码质量与安全分析配置
# 职责分工（SonarQube Community Edition 不支持 Swift 语言分析）：
#   - SonarQube：负责 Tools 脚本（Python/Shell/YAML）代码质量 + 重复率 + Secrets 扫描
#   - xccov 本地脚本（check_xccov_coverage.py）：负责 Swift 覆盖率门禁（语句+分支）
# 核心质量门禁 (Quality Gate):
#   1. 代码重复率 (Duplicated Lines %) < 3.0%
#   2. Secrets/敏感信息扫描
#   3. Python/Shell/YAML 代码质量（Bugs/Code Smells/Vulnerabilities）
# Swift 覆盖率门禁由 Tools/CI/check_xccov_coverage.py 在 test 阶段本地执行
# ==============================================================================

# 项目元数据定义
sonar.projectKey=ZhiYu
sonar.projectName=ZhiYu
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# SonarQube 服务器连接（自建实例，CI 通过环境变量覆盖）
sonar.host.url=http://localhost:9000

# 自建 SonarQube Community 版不支持 organization，显式禁用
sonar.organization=

# 单模块定义：仅 Tools 脚本（Python/Shell/YAML）
# Swift 源码不纳入 SonarQube 分析（Community Edition 不支持 Swift）
sonar.modules=tools-scripts

# ── 自动化脚本与配置模块 (Python / Shell / YAML) 内部属性配置 ──────────────────
tools-scripts.sonar.projectBaseDir=.
tools-scripts.sonar.projectName=ZhiYu Tools & Pipeline Scripts (Python / Shell / YAML)
tools-scripts.sonar.sources=Tools,fastlane,Config,.github
tools-scripts.sonar.inclusions=**/*.py,**/*.sh,**/*.bash,**/*.yaml,**/*.yml,project.yml,.gitlab-ci.yml
tools-scripts.sonar.python.version=3.12
