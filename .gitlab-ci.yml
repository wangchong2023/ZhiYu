# ============================================================
# ZhiYu iOS/macOS/watchOS GitLab CI/CD 流水线 (v3.2.0)
#
# 运行环境: macOS 宿主机 Shell Runner（tagged: macos, shell, xcode, arm64）
#   - 必须在安装了 Xcode 的 Mac 上运行
#   - 使用 GitLab Shell Runner，不需要 Docker
#
# 架构: prepare 生成项目 → analyze 静态分析+告警门禁 → build → test → SonarQube
#   - build-prepare 生成 ZhiYu.xcodeproj + Config/.env.local，通过 artifacts 传递
#   - static-analysis: 22 项并行检查（Python/SwiftLint/架构审计 + Swift 编译告警门禁）
#   - 后续 build Job 复用 prepare artifacts，跳过重复生成
#   - Shell Runner 单机部署，build Job 串行执行
#   - SonarQube 在测试后运行，包含覆盖率报告（SonarSource 官方脚本生成，含分支数据）
#
# 执行顺序:
#   prepare(生成工程) → analyze(静态分析+Swift告警门禁) → build(ios→macos→watchos) → test → sonar
#
# 流程控制:
#   仅 main/develop/release/* 分支触发完整流水线
# ============================================================

stages:
  - prepare
  - analyze
  - build
  - test
  - sonar
  - perf

default:
  tags:
    - macos
    - shell
    - xcode
    - arm64
  before_script:
    - echo "export OPENSRC_ROOT=${OPENSRC_ROOT:-/Users/constantine/Documents/work/code/opensrc/swift}" > Config/.env.local

# ════════════════════════════════════════════════════════════
# prepare — 生成 Xcode 工程（artifacts 传递给后续 Job）
# ════════════════════════════════════════════════════════════

build-prepare:
  stage: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make gen
    - bash Tools/CI/build-pipeline-version-inject.sh Sources/Info.plist
  artifacts:
    paths:
      - ZhiYu.xcodeproj/
      - Config/.env.local
    expire_in: 1 hour

# ════════════════════════════════════════════════════════════
# analyze — 静态代码分析 + Swift 编译告警门禁（39 项并行检查）
#   含: 架构审计/Python/SwiftLint/Swift 编译告警(-warnings-as-errors)/SBOM/OWASP MASVS 等
# ════════════════════════════════════════════════════════════

static-analysis:
  stage: analyze
  needs: [build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - echo "===> 安装静态分析 Python 依赖"
    - pip3 install --quiet radon 2>/dev/null || true
    - echo "===> 运行全部静态分析（含 Swift 编译告警门禁）"
    - bash Tools/CI/run-code-static-analysis.sh

# ════════════════════════════════════════════════════════════
# analyze — 插件安全校验（扫描所有 .zyplugin 包）
# ════════════════════════════════════════════════════════════

plugin-validation:
  stage: analyze
  needs: [build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - echo "===> 运行插件安全校验（扫描所有 .zyplugin 包）"
    - make plugin-scan

# ════════════════════════════════════════════════════════════
# build — 多平台构建（串行，复用 prepare artifacts）
# ════════════════════════════════════════════════════════════

build-ios:
  stage: build
  needs: [build-prepare, static-analysis]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make ios

build-macos:
  stage: build
  needs: [build-ios, build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make mac

build-watchos:
  stage: build
  needs: [build-macos, build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make watch

# ════════════════════════════════════════════════════════════
# test — 单元测试 + 覆盖率验证
# ════════════════════════════════════════════════════════════

test-and-coverage:
  stage: test
  needs: [build-watchos, build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - export PATH="/opt/homebrew/opt/ruby/bin:/opt/homebrew/lib/ruby/gems/4.0.0/bin:$PATH"
    - bash Tools/CI/run-test-with-coverage.sh
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    when: always
    paths:
      - build/coverage/
    expire_in: 7 days

# ════════════════════════════════════════════════════════════
# sonar — SonarQube 全语言代码质量分析 + 覆盖率 + Quality Gate
# ════════════════════════════════════════════════════════════

sonarqube-analysis:
  stage: sonar
  needs: [test-and-coverage]
  dependencies: [test-and-coverage]
  allow_failure: false
  variables:
    SONAR_HOST_URL: "http://10.211.55.2:9000"
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - echo "===> 运行 SonarQube 全语言代码质量分析 (Swift, Python, Shell, YAML) + 覆盖率报告（含分支）+ Quality Gate 硬阻断"
    - |
      if [ -f build/coverage/sonarqube-generic-coverage.xml ]; then
        echo "  发现覆盖率报告（SonarSource 官方脚本生成，含分支数据），注入 sonar.coverageReportPaths"
        sonar-scanner \
          -Dsonar.host.url=${SONAR_HOST_URL} \
          -Dsonar.coverageReportPaths=build/coverage/sonarqube-generic-coverage.xml \
          -Dsonar.qualitygate.wait=true
      else
        echo "  ⚠️  未发现覆盖率报告，仅运行代码质量扫描"
        sonar-scanner \
          -Dsonar.host.url=${SONAR_HOST_URL} \
          -Dsonar.qualitygate.wait=true
      fi

# ════════════════════════════════════════════════════════════
# perf — 性能测试 + 回归基线（每周夜间运行 + 手动触发）
# ════════════════════════════════════════════════════════════

perf-baseline:
  stage: perf
  needs: [build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop)$/ && $PERF_RUN == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - export PATH="/opt/homebrew/opt/ruby/bin:/opt/homebrew/lib/ruby/gems/4.0.0/bin:$PATH"
    - echo "===> 运行性能测试套件 + 生成回归基线"
    - make perf-baseline
    - bash Tools/CI/generate-pipeline-perf-baseline.sh
  artifacts:
    when: always
    paths:
      - build/.perf_baselines/
    expire_in: 30 days
    reports:
      junit: build/perf-junit.xml

