# ============================================================
# ZhiYu iOS/macOS/watchOS GitLab CI/CD 流水线 (v2.0.0)
#
# 运行环境: macOS 宿主机 Shell Runner（tagged: macos, shell, xcode, arm64）
#   - 必须在安装了 Xcode 的 Mac 上运行
#   - 使用 GitLab Shell Runner，不需要 Docker
#
# 架构: 单 Job 串行构建
#   - Shell Runner 单机部署，多 Job 并行无收益
#   - 避免 artifacts 传递和重复 checkout 开销
#   - prepare + build + test 在同一 Job 内完成
#
# 执行顺序:
#   analyze(静态分析 + SonarQube) → build(全平台构建 + 测试)
#
# 流程控制:
#   仅 main/develop/release/* 分支 push 触发完整流水线
#   所有分支 push 触发 static-analysis
# ============================================================

stages:
  - analyze
  - build

default:
  tags:
    - macos
    - shell
    - xcode
    - arm64
  before_script:
    - |
      if [ -n "${OPENSRC_ROOT:-}" ]; then
        echo "export OPENSRC_ROOT=${OPENSRC_ROOT}" > Config/.env.local
      fi

# ════════════════════════════════════════════════════════════
# analyze — 静态代码分析（所有分支）
# ════════════════════════════════════════════════════════════

static-analysis:
  stage: analyze
  script:
    - echo "===> 安装静态分析 Python 依赖"
    - pip3 install --quiet radon 2>/dev/null || true
    - echo "===> 运行全部静态分析"
    - bash Tools/CI/Analyze/run_static_analysis.sh

sonarqube-analysis:
  stage: analyze
  allow_failure: false
  variables:
    SONAR_HOST_URL: "http://10.211.55.2:9000"
  script:
    - echo "===> 运行 SonarQube 全语言代码质量分析 (Swift, Python, Shell, YAML) 与 Quality Gate 硬阻断"
    - sonar-scanner
        -Dsonar.host.url=${SONAR_HOST_URL}
        -Dsonar.qualitygate.wait=true

# ════════════════════════════════════════════════════════════
# build — 全平台构建 + 单元测试（单 Job 串行）
# ════════════════════════════════════════════════════════════

build-all:
  stage: build
  needs: [static-analysis, sonarqube-analysis]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - echo "===> [1/5] 生成 Xcode 工程"
    - make gen
    - bash Tools/CI/Build/inject_version.sh Sources/Info.plist
    - echo "===> [2/5] 构建 iOS"
    - make ios
    - echo "===> [3/5] 构建 macOS"
    - make mac
    - echo "===> [4/5] 构建 watchOS"
    - make watch
    - echo "===> [5/5] 单元测试 + 覆盖率"
    - bash Tools/CI/Test/run_tests_and_coverage.sh
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    when: always
    paths:
      - build/coverage/
    expire_in: 7 days
