# ============================================================
# ZhiYu iOS/macOS/watchOS GitLab CI/CD 流水线 (v3.1.0)
#
# 运行环境: macOS 宿主机 Shell Runner（tagged: macos, shell, xcode, arm64）
#   - 必须在安装了 Xcode 的 Mac 上运行
#   - 使用 GitLab Shell Runner，不需要 Docker
#
# 架构: prepare 生成项目 → artifacts 传递 → 串行构建 → 测试 → SonarQube
#   - build-prepare 生成 ZhiYu.xcodeproj + Config/.env.local，通过 artifacts 传递
#   - 后续 Job 通过 dependencies 下载 artifacts，跳过重复 checkout/生成
#   - Shell Runner 单机部署，build Job 串行执行
#   - SonarQube 在测试后运行，包含 slather 生成的覆盖率报告
#
# 执行顺序:
#   analyze(静态分析) → prepare → build(ios→macos→watchos) → test → sonar(SonarQube+覆盖率)
#
# 流程控制:
#   仅 main/develop/release/* 分支触发完整流水线
#   所有分支 push 触发 static-analysis
# ============================================================

stages:
  - analyze
  - prepare
  - build
  - test
  - sonar

default:
  tags:
    - macos
    - shell
    - xcode
    - arm64
  before_script:
    - |
      if [ -n "${OPENSRC_ROOT:-}" ] && [ ! -f Config/.env.local ]; then
        echo "export OPENSRC_ROOT=${OPENSRC_ROOT}" > Config/.env.local
      fi

# ════════════════════════════════════════════════════════════
# analyze — 静态代码分析（所有分支）
# ════════════════════════════════════════════════════════════

static-analysis:
  stage: analyze
  script:
    - echo "===> 安装静态分析 Python 依赖"
    - pip3 install --quiet radon 2>/dev/null || true
    - echo "===> 运行全部静态分析"
    - bash Tools/CI/run-code-static-analysis.sh

sonarqube-analysis:
  stage: sonar
  needs: [test-and-coverage]
  dependencies: [test-and-coverage]
  allow_failure: false
  variables:
    SONAR_HOST_URL: "http://10.211.55.2:9000"
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - echo "===> 运行 SonarQube 全语言代码质量分析 (Swift, Python, Shell, YAML) + slather 覆盖率 + Quality Gate 硬阻断"
    - |
      if [ -f build/coverage/sonarqube-generic-coverage.xml ]; then
        echo "  发现 slather 覆盖率报告，注入 sonar.coverageReportPaths"
        sonar-scanner \
          -Dsonar.host.url=${SONAR_HOST_URL} \
          -Dsonar.coverageReportPaths=build/coverage/sonarqube-generic-coverage.xml \
          -Dsonar.qualitygate.wait=true
      else
        echo "  ⚠️  未发现覆盖率报告，仅运行代码质量扫描"
        sonar-scanner \
          -Dsonar.host.url=${SONAR_HOST_URL} \
          -Dsonar.qualitygate.wait=true
      fi

# ════════════════════════════════════════════════════════════
# prepare — 生成 Xcode 工程（artifacts 传递给后续 Job）
# ════════════════════════════════════════════════════════════

build-prepare:
  stage: prepare
  needs: [static-analysis]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make gen
    - bash Tools/CI/build-pipeline-version-inject.sh Sources/Info.plist
  artifacts:
    paths:
      - ZhiYu.xcodeproj/
      - Config/.env.local
    expire_in: 1 hour

# ════════════════════════════════════════════════════════════
# build — 多平台构建（串行，复用 prepare artifacts）
# ════════════════════════════════════════════════════════════

build-ios:
  stage: build
  needs: [build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make ios

build-macos:
  stage: build
  needs: [build-ios, build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make mac

build-watchos:
  stage: build
  needs: [build-macos, build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - make watch

# ════════════════════════════════════════════════════════════
# test — 单元测试 + 覆盖率验证
# ════════════════════════════════════════════════════════════

test-and-coverage:
  stage: test
  needs: [build-watchos, build-prepare]
  dependencies: [build-prepare]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release\/.*)$/'
  script:
    - export PATH="/opt/homebrew/opt/ruby/bin:/opt/homebrew/lib/ruby/gems/4.0.0/bin:$PATH"
    - bash Tools/CI/run-test-with-coverage.sh
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    when: always
    paths:
      - build/coverage/
    expire_in: 7 days
