# ==============================================================================
# ZhiYu 免白名单注册表 — 手动维护部分 (Manual Whitelist SSOT)
# ==============================================================================
# 用途：exemption_registry.py 加载本文件，作为"无法自动收集"的豁免项 SSOT。
#       自动收集的符号（Apple SDK / 第三方库 / 项目代码）不在此文件中登记。
#
# 动态维护机制：
#   1. 自动收集：exemption_registry.py 运行时自动扫描 Sources/Tests/、
#      xcrun swift-symbolgraph-extract、.build/checkouts/，生成动态符号集
#   2. 反向校验：expiry_check=true 的项会被检测，若已在代码中实现则报告为"过期"
#   3. Git 钩子：pre-push 时自动重建符号缓存 + 校验漂移 + 过期检测
#
# 字段说明：
#   symbol: 豁免的符号名
#   reason: 豁免理由（必填）
#   added: 添加日期（YYYY-MM-DD）
#   expiry_check: 是否参与过期检测
#     - true: 若该符号已在代码/第三方库中实现，报告为过期，建议移除
#     - false: 永不过期（概念词、SQL 列名、占位符等非代码符号）
#   category: 分类标签（用于按审计域查询）
# ==============================================================================

