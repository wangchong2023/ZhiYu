  - name: AppAuth-iOS
    upstream: "https://github.com/openid/AppAuth-iOS.git"
    version: "a972daac"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "Google OIDC 认证直接依赖（iOS/macOS 统一 AppAuth，OIDAuthorizationService + PKCE 产出 idToken）"

  # ── 已弃用依赖（GoogleSignIn 迁移至 AppAuth 后不再被项目引用）────────────────
