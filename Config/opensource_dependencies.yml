# ==============================================================================
# ZhiYu 开源依赖注册表 (Single Source of Truth)
# ==============================================================================
# 用途：check-arch-dependency-registry.py 以本文件为 SSOT，审计：
#   1. project.yml.template 中所有 ${OPENSRC_ROOT}/<name> 引用是否在本表登记
#   2. 本表 integration=project_yml_path 的库是否在 project.yml.template 中以 ${OPENSRC_ROOT} 引入
#   3. 本表 integration=project_yml_path 的库是否已克隆到 OPENSRC_ROOT/<name>（若环境变量设置）
#
# 字段说明：
#   name: 库目录名（与 OPENSRC_ROOT 下的目录名一致）
#   upstream: 上游仓库 URL
#   version: 锁定版本（tag/branch/commit）
#   integration: 集成方式
#     - project_yml_path: 通过 project.yml.template 的 ${OPENSRC_ROOT}/<name> 引入
#     - spm: 通过 Package.swift 的 .package(path:) 引入（本地 SPM 包）
#   license: 开源许可证
#   purpose: 用途说明
# ==============================================================================

dependencies:
  - name: GRDB.swift
    upstream: "https://github.com/groue/GRDB.swift.git"
    version: "v6.29.0"
    integration: project_yml_path
    license: MIT
    purpose: "SQLite + FTS5 数据库引擎"

  - name: SwiftJSONSanitizer
    upstream: "https://github.com/antigravity/SwiftJSONSanitizer.git"
    version: "main"
    integration: project_yml_path
    license: MIT
    purpose: "JSON 安全解析与清洗"

  - name: PartialJSON
    upstream: "https://github.com/antigravity/PartialJSON.git"
    version: "main"
    integration: project_yml_path
    license: MIT
    purpose: "流式 JSON 部分解析（LLM 流式响应）"

  - name: lottie-ios
    upstream: "https://github.com/airbnb/lottie-ios.git"
    version: "main"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "Lottie 动画渲染"

  - name: swift-docc-plugin
    upstream: "https://github.com/apple/swift-docc-plugin.git"
    version: "main"
    integration: spm
    license: MIT
    purpose: "Swift 文档生成插件（docc）"

  - name: swift-docc-symbolkit
    upstream: "https://github.com/swiftlang/swift-docc-symbolkit.git"
    version: "main"
    integration: spm
    license: Apache-2.0
    purpose: "Swift 文档符号提取工具（swift-docc-plugin 依赖）"

  - name: swift-markdown-ui
    upstream: "https://github.com/gonzalezreal/swift-markdown-ui.git"
    version: "main"
    integration: project_yml_path
    license: MIT
    purpose: "Markdown 渲染 UI 组件"

  - name: NetworkImage
    upstream: "https://github.com/gonzalezreal/swift-markdown-ui.git"
    version: "main"
    integration: project_yml_path
    license: MIT
    purpose: "swift-markdown-ui 传递依赖（异步网络图片加载）"

  - name: swift-cmark
    upstream: "https://github.com/swiftlang/swift-cmark.git"
    version: "gfm"
    integration: project_yml_path
    license: MIT
    purpose: "swift-markdown 传递依赖（CMark GFM 解析器）"

  - name: swift-markdown
    upstream: "https://github.com/apple/swift-markdown.git"
    version: "main"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "Markdown 解析（Apple 官方）"

  - name: ZIPFoundation
    upstream: "https://github.com/weichsel/ZIPFoundation.git"
    version: "main"
    integration: project_yml_path
    license: MIT
    purpose: "ZIP 压缩/解压"

  - name: swift-snapshot-testing
    upstream: "https://github.com/pointfreeco/swift-snapshot-testing.git"
    version: "1.17.0"
    integration: project_yml_path
    license: MIT
    purpose: "SwiftUI 快照测试"

  - name: swift-dependencies
    upstream: "https://github.com/pointfreeco/swift-dependencies.git"
    version: "main"
    integration: spm
    license: MIT
    purpose: "@Dependency 属性包装器 + DependencyKey 注册体系（替代 @Inject + ServiceContainer）"

  - name: combine-schedulers
    upstream: "https://github.com/pointfreeco/combine-schedulers.git"
    version: "main"
    integration: spm
    license: MIT
    purpose: "swift-dependencies 传递依赖（Combine 调度器）"

  - name: swift-clocks
    upstream: "https://github.com/pointfreeco/swift-clocks.git"
    version: "main"
    integration: spm
    license: MIT
    purpose: "swift-dependencies 传递依赖（时钟抽象）"

  - name: swift-concurrency-extras
    upstream: "https://github.com/pointfreeco/swift-concurrency-extras.git"
    version: "main"
    integration: spm
    license: MIT
    purpose: "swift-dependencies 传递依赖（并发工具）"

  - name: xctest-dynamic-overlay
    upstream: "https://github.com/pointfreeco/xctest-dynamic-overlay.git"
    version: "main"
    integration: spm
    license: MIT
    purpose: "swift-dependencies 传递依赖（XCTest 动态覆盖）"

  - name: swift-syntax
    upstream: "https://github.com/swiftlang/swift-syntax.git"
    version: "509.0.0"
    integration: spm
    license: Apache-2.0
    purpose: "swift-dependencies 传递依赖（Swift 语法树，宏支持）"

  - name: GoogleSignIn-iOS
    upstream: "https://github.com/google/GoogleSignIn-iOS.git"
    version: "10.0.0"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "Google 账号登录 SDK（GIDSignIn 拉取 idToken，Info.plist 标准键 GIDClientID）"
    note: "本地克隆的 Package.swift 依赖已打本地 path 补丁（见下方 8 个传递依赖），升级需重打补丁"

  # ── GoogleSignIn-iOS 传递依赖（离线化，本地 path 补丁）────────────────
  # 均通过修改 GoogleSignIn-iOS/Package.swift 与 app-check/GTMAppAuth/Package.swift
  # 中的 .package(url:) 为 .package(path:) 引入，故在此登记以便架构审计通过。
  - name: app-check
    upstream: "https://github.com/google/app-check.git"
    version: "97f7d74d"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（AppCheckCore，本地 path 补丁）"

  - name: AppAuth-iOS
    upstream: "https://github.com/openid/AppAuth-iOS.git"
    version: "a972daac"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（AppAuth/AppAuthCore，本地 path 补丁）"

  - name: GoogleUtilities
    upstream: "https://github.com/google/GoogleUtilities.git"
    version: "5459ee56"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（GUL 工具，本地 path 补丁）"

  - name: gtm-session-fetcher
    upstream: "https://github.com/google/gtm-session-fetcher.git"
    version: "724a52ee"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（GTMSessionFetcherCore，本地 path 补丁）"

  - name: GTMAppAuth
    upstream: "https://github.com/google/GTMAppAuth.git"
    version: "57094cd4"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（GTMAppAuth，本地 path 补丁）"

  - name: interop-ios-for-google-sdks
    upstream: "https://github.com/google/interop-ios-for-google-sdks.git"
    version: "040d087a"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（interop，本地 path 补丁）"

  - name: ocmock
    upstream: "https://github.com/firebase/ocmock.git"
    version: "7291762d"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（OCMock 测试替身，本地 path 补丁）"
    note: "本地补丁含两处：① 依赖经 GoogleSignIn-iOS/Package.swift 的 path 引入；② Package.swift target 的 exclude 移除了本 commit 不存在的 Carthage/ 与 OCMock/en.lproj/ 路径（消除 SwiftPM Invalid Exclude 告警）。"

  - name: promises
    upstream: "https://github.com/google/promises.git"
    version: "f4a19a3c"
    integration: project_yml_path
    license: Apache-2.0
    purpose: "GoogleSignIn 传递依赖（FBLPromises，本地 path 补丁）"
