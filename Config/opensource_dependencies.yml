  # 但因 ${OPENSRC_ROOT} 磁盘克隆仍存在，其 Package.swift 内部 path 依赖须保持注册
  # 以通过 check-arch-opensource-internal-deps.py 审计；待清理磁盘克隆后一并移除。
  - name: GoogleSignIn-iOS
    upstream: "https://github.com/google/GoogleSignIn-iOS.git"
    version: "10.0.0"
    integration: spm
    license: Apache-2.0
    purpose: "已弃用：GoogleSignIn SDK（ADR-014 迁移至 AppAuth），仅为磁盘克隆注册一致性保留"
    note: "已不被项目引用；清理 ${OPENSRC_ROOT}/GoogleSignIn-iOS 磁盘克隆后可删除本条目"

  - name: app-check
