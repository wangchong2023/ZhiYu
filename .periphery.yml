# .periphery.yml
# ZhiYu 项目死代码检测配置
# 工具：Periphery 2.21.2
# 文档：https://github.com/peripheryapp/periphery
#
# 执行：periphery scan
# CI 封装：python3 Tools/Gatekeeper/Sanity/check_dead_code.py
#

# Xcode 项目路径
project: ZhiYu.xcodeproj

# 需要编译的 Scheme
schemes:
  - ZhiYu

# 需要扫描的 Target（Xcode 项目必填）
# 包含 ZhiYuTests 让测试中引用的生产代码不被误报为死代码
targets:
  - ZhiYu
  - ZhiYuTests

# 输出格式（xcode 格式方便 CI 解析）
format: xcode

# ==============================================================================
# 排除范围（不参与死代码检测的路径）
# ==============================================================================
report_exclude:
  # 测试代码不检测（测试桩/Mock 天然是"未使用"的）
  - "Tests/**"
  - "**/*Tests.swift"
  - "**/*Mock*.swift"
  - "**/*Stub*.swift"

  # 生成文件与工具脚本
  - "Tools/**"
  - "DerivedData/**"
  - "build/**"

  # Widget 扩展（独立 Target，会误报）
  - "Sources/Platforms/iOS/Widgets/**"

  # L10n 扩展（通过字符串 key 动态调用，静态分析无法识别）
  - "Sources/Localization/**"

# ==============================================================================
# 保留注解（在代码中用 // periphery:ignore 标注刻意保留的"未使用"符号）
# ==============================================================================
# 在代码中：
#   // periphery:ignore
#   public func intentionallyUnused() { ... }

# 相对宽松的报告策略：只报 ERROR 级别（真实死代码），WARNING 作信息提示
# retain_public: true  # 保留所有 public API（开源库导出接口不报警）
retain_public: true

# 保留遵循已知协议的声明（防止 Protocol Witness 误报）
retain_unused_protocol_func_params: true

# 保留只赋值未读取的属性（数据模型/预留字段，非死代码）
retain_assign_only_properties: true

# ==============================================================================
# 文件级保留（retain-files）
# 保留整个文件中的所有声明，适用于：
# - 协议定义文件（Periphery 误报 redundant 协议方法为 unused）
# - 预留工具/API 文件（当前未接入但保留架构层）
# ==============================================================================
retain_files:
  # 协议定义文件（协议方法被报为 unused，但协议是架构契约）
  - "Sources/Infrastructure/LLM/LLMProtocols.swift"
  - "Sources/Infrastructure/LLM/LLMAdapters.swift"
  - "Sources/Infrastructure/Plugins/PluginProtocols.swift"
  - "Sources/Infrastructure/Plugins/PluginRuntime.swift"
  - "Sources/Infrastructure/Plugins/PluginRegistry.swift"
  - "Sources/Infrastructure/Processors/Network/WebScraperProcessor.swift"
  - "Sources/Infrastructure/Plugins/PluginSandboxGateway.swift"

  # 预留工具/API（当前未接入但保留架构层）
  - "Sources/Infrastructure/Performance/PerformanceBenchmarker.swift"

  # 常量文件（Periphery 误报被动态调用的常量为 unused）
  - "Sources/Infrastructure/Storage/StorageConstants.swift"
  - "Sources/Infrastructure/Plugins/PluginConstants.swift"

  # GRDB 协议方法（willUpdate 的 columns 参数未使用但协议要求保留签名）
  - "Sources/Infrastructure/Storage/Extensions/PluginRecord+GRDB.swift"

  # Demo 图片构建器（Periphery 误报 size/cgContext/title 参数为 unused）
  - "Sources/Infrastructure/Storage/Utility/DemoImageBuilder.swift"

  # ==============================================================================
  # 死代码清理批次保留文件（2026-08-08）
  # ==============================================================================

  # App 层 — SwiftUI @State/@Environment 属性或架构契约
  - "Sources/App/Core/AppEnvironment.swift"
  - "Sources/App/Lifecycle/AppWindowSceneDelegate.swift"
