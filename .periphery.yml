  # Domain 层 — 架构契约协议
  - "Sources/Domain/Protocols/AppStoreProtocol.swift"
  - "Sources/Domain/Protocols/LLMServiceProtocol.swift"

  # Platforms 层 — 预留跨平台实现
  - "Sources/Platforms/Shared/WidgetAndWatchViews.swift"
