# ci.yml
#
# 作者: Wang Chong
# 功能说明: 智宇 (ZhiYu) 全自动持续集成流水线
#          快速静态检查 → 构建测试 → 覆盖率红线 → 多平台编译验证
# 版本: 3.0
# 日期: 2026-06-14
#
# 变更 (v3.0):
#   - Xcode 15.4 → latest-stable（匹配 Swift 6 严格并发要求）
#   - macOS runner: macos-14 → macos-15（Xcode 16+ 仅支持最新 macOS）
#   - 多平台构建改为矩阵并行，缩短总耗时约 40%
#   - 新增测试产物上传（.xcresult + 原始日志），失败时保留现场
#   - Monkey 测试显式跳过（本质不稳定，不适合 CI）
# 变更 (v2.0):
#   - 重排执行顺序：快速检查（SPM/Lint/安全）优先于耗时的构建测试
#   - 去冗余：Fastlane 仅负责测试，不再重复执行 SwiftLint
#   - 补全：主流水线新增硬编码密钥扫描 + 本地化强制检查
#   - 多平台：新增 macOS / watchOS 编译验证，防止跨平台破坏性变更
#   - 命名：步骤名称与实际执行内容严格对齐

name: ZhiYu CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ── Stage 0: 本地 6 大 SPM 模块极速单测守门（15秒极速熔断） ─────────
  fast-spm-test:
    name: Fast SPM Unit Tests (Pre-gate)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Cache SwiftPM & Local Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm/cache
            .build
          key: spm-packages-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift') }}
          restore-keys: |
            spm-packages-${{ runner.os }}-

      - name: Run All SPM Unit Tests (UFPCore / Storage / DesignSystem / Domain / AICore / Features)
        run: |
          make test-spm-all

  # ── Stage 1: 代码质量快速检查 ───────────────────────────────────────
  lint-and-audit:
    name: Audit Code Quality
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Build Toolchain
        run: |
          brew install xcodegen swiftlint

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Full Static Analysis & Quality Gatekeepers (42 Concurrent Audits)
        run: |
          bash Tools/scripts/python-venv-bootstrap.sh >/dev/null
          bash Tools/CI/run-code-static-analysis.sh

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/sbom.spdx.json
          retention-days: 90

      - name: Upload Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: ZhiYu.xcodeproj/
          retention-days: 1

  # ── Stage 2: 构建 + 单元测试 + 覆盖率 ────────────────────────────────
  test:
    name: Test & Verify Coverage
    needs: [lint-and-audit, fast-spm-test]
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: ZhiYu.xcodeproj/

      - name: Restore SPM Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ZhiYu.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Inject Version
        run: bash Tools/CI/Build/inject_version.sh Sources/Info.plist

      - name: Install Test Toolchain
        run: |
          brew install xcbeautify xcodegen

      - name: List Available Simulators
        run: |
          echo "=== 可用 iPhone 模拟器列表 ==="
          xcrun simctl list devices available | grep iPhone || echo "(none)"

      - name: Run Unit Tests
        run: |
          chmod +x Tools/CI/Test/run_unit_tests.sh
          ./Tools/CI/Test/run_unit_tests.sh

      - name: Enforce Coverage Threshold
        run: python3 Tools/CI/Test/check_coverage.py

      - name: SonarQube 全语言 Quality Gate 质量门禁校验 (Swift, Python, Shell, YAML)
        run: |
          sonar-scanner \
            -Dsonar.qualitygate.wait=true

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: |
            build/test_raw.log
            build/test_report.junit
            build/DerivedData-ios/Logs/Test/*.xcresult

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_report.txt

  # ── Stage 3: UI 测试（独立阶段）──────────────────────────────────────
  ui-test:
    name: Validate UI (iPhone)
    needs: [lint-and-audit, fast-spm-test]
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: ZhiYu.xcodeproj/

      - name: Restore SPM Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ZhiYu.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Inject Version
        run: bash Tools/CI/Build/inject_version.sh Sources/Info.plist

      - name: Run UI Tests
        run: |
          chmod +x Tools/CI/Test/run_ui_tests.sh
          ./Tools/CI/Test/run_ui_tests.sh

      - name: Upload UI Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ui
          path: |
            build/ui_test_output.log
            build/DerivedData/Logs/Test/*.xcresult

  # ── Stage 3b: iPad UI 验证 ──────────────────────────────────
  ipad-ui-test:
    name: Validate UI (iPad)
    needs: [lint-and-audit, fast-spm-test]
    runs-on: macos-15
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: ZhiYu.xcodeproj/

      - name: Inject Version
        run: bash Tools/CI/Build/inject_version.sh Sources/Info.plist

      - name: Restore SPM Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ZhiYu.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run iPad UI Tests
        run: bash Tools/CI/Test/run_ipad_ui_tests.sh
        timeout-minutes: 20

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ipad
          path: |
            build/ipad_ui_test.log
            build/DerivedData/Logs/Test/*.xcresult

  # ── Stage 3c: Mac Catalyst UI 验证 ──────────────────────────
  mac-catalyst-ui-test:
    name: Validate UI (Mac)
    needs: [lint-and-audit, fast-spm-test]
    runs-on: macos-15
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: ZhiYu.xcodeproj/

      - name: Inject Version
        run: bash Tools/CI/Build/inject_version.sh Sources/Info.plist

      - name: Restore SPM Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ZhiYu.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run Mac Catalyst UI Tests
        run: bash Tools/CI/Test/run_mac_catalyst_ui_tests.sh
        timeout-minutes: 20

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-mac-catalyst
          path: |
            build/mac_catalyst_ui_test.log
            build/DerivedData/Logs/Test/*.xcresult

  # ── Stage 4: 多平台编译验证 ──────────────────────────────────
  multi-platform:
    name: Compile ${{ matrix.platform.name }}
    needs: [lint-and-audit, fast-spm-test]
    runs-on: macos-15
    strategy:
      matrix:
        platform:
          - scheme: ZhiYu
            destination: 'generic/platform=iOS Simulator'
            name: iOS
          - scheme: ZhiYuMac
            destination: 'platform=macOS'
            name: macOS
          - scheme: ZhiYuWatch
            destination: 'generic/platform=watchOS Simulator'
            name: watchOS
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: ZhiYu.xcodeproj/

      - name: Restore SPM Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ZhiYu.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Inject Version
        run: bash Tools/CI/Build/inject_version.sh Sources/Info.plist

      - name: Compile ${{ matrix.platform.name }}
        run: |
          xcodebuild build \
            -project ZhiYu.xcodeproj \
            -scheme '${{ matrix.platform.scheme }}' \
            -destination '${{ matrix.platform.destination }}' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -30
